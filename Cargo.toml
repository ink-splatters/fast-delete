[package]
name = "fdel"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"

[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
sysctl = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
